<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#da212f" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="format-detection" content="date=no, address=no, email=no" />
  <title>مؤسسة أحمد دخيل الموسى</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #da212f;
      --red-dark: #b3151f;
      --red-deep: #8f0f18;
      --yellow: #f5e011;
      --yellow-soft: #ffe95c;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.82);
      --card: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.28);
      --wa: #25d366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      background: var(--red);
      background: radial-gradient(circle at 50% -10%, #e8323f 0%, var(--red) 45%, var(--red-dark) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* زخارف خلفية ناعمة */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }
    body::before { width: 340px; height: 340px; background: #ff5a63; top: -130px; left: -90px; opacity: 0.45; }
    body::after { width: 320px; height: 320px; background: var(--yellow); bottom: -140px; right: -90px; opacity: 0.18; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      text-align: center;
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* لوحة المؤسسة */
    .banner {
      display: block;
      width: 100%;
      border-radius: 14px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      background: var(--red);
    }

    h1 {
      margin-top: 26px;
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 90px;
      height: 4px;
      margin: 22px auto 26px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent);
    }

    .section-title {
      text-align: right;
      font-size: 16px;
      color: var(--yellow-soft);
      font-weight: 800;
      margin: 4px 4px 14px;
    }

    /* بطاقة رقم */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .contact-row:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.18); }

    .contact-info {
      flex: 1;
      text-align: right;
    }
    .contact-info .label { font-size: 13px; color: var(--yellow-soft); font-weight: 700; }
    /* منع سفاري بالجوال من تلوين الأرقام بالأزرق */
    .contact-info .num a,
    .contact-info .num a:link,
    .contact-info .num a:visited,
    .contact-info .num a:hover,
    .contact-info .num a:active {
      color: #fff !important;
      text-decoration: none !important;
      -webkit-text-fill-color: #fff;
    }

    .contact-info .num {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      direction: ltr;
      unicode-bidi: plaintext;
      color: #fff;
    }

    .actions { display: flex; gap: 8px; }

    .btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: scale(1.08); }
    .btn svg { width: 22px; height: 22px; }

    .btn-call { background: linear-gradient(145deg, #fff, #f0f0f0); color: var(--red-dark); box-shadow: 0 6px 16px rgba(0,0,0,0.28); }
    .btn-wa { background: linear-gradient(145deg, #2ce670, var(--wa)); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28); }

    /* روابط سفلية */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .social:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .social svg { width: 22px; height: 22px; }

    .s-map { background: linear-gradient(145deg, #ffffff, #f2f2f2); color: var(--red-dark); }
    .s-snap { background: linear-gradient(145deg, #fffc00, var(--yellow)); color: #1a1a1a; }
    .s-tiktok { background: linear-gradient(145deg, #2b2b2b, #000); grid-column: 1 / -1; }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.5px;
    }

    @media (max-width: 380px) {
      h1 { font-size: 24px; }
      .subtitle { font-size: 16px; }
      .contact-info .num { font-size: 18px; }
    }
  </style>
</head>
