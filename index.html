<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مؤسسة أحمد دخيل الموسى</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c8a24a;
      --gold-light: #e6c977;
      --dark: #0e1526;
      --dark-2: #16203a;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(200, 162, 74, 0.28);
      --text: #f3f4f8;
      --muted: #b9c0d0;
      --wa: #25d366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #1c2848 0%, var(--dark) 55%, #0a0f1d 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* زخارف خلفية ناعمة */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
    }
    body::before { width: 340px; height: 340px; background: #c8a24a; top: -120px; left: -80px; }
    body::after { width: 300px; height: 300px; background: #2a5cff; bottom: -120px; right: -80px; opacity: 0.25; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      background: linear-gradient(160deg, rgba(22, 32, 58, 0.9), rgba(14, 21, 38, 0.92));
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 26px 32px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      text-align: center;
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* الشعار / الحرف */
    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      color: var(--dark);
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(200, 162, 74, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.25);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--gold-light), #fff, var(--gold-light));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .divider {
      width: 70px;
      height: 3px;
      margin: 20px auto 26px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .section-title {
      text-align: right;
      font-size: 15px;
      color: var(--gold-light);
      font-weight: 700;
      margin: 4px 4px 12px;
    }

    /* بطاقة رقم */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .contact-row:hover { transform: translateY(-2px); border-color: var(--card-border); }

    .contact-info {
      flex: 1;
      text-align: right;
    }
    .contact-info .label { font-size: 13px; color: var(--muted); }
    .contact-info .num {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      direction: ltr;
      unicode-bidi: plaintext;
      color: #fff;
    }

    .actions { display: flex; gap: 8px; }

    .btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: scale(1.08); }
    .btn svg { width: 22px; height: 22px; }

    .btn-call { background: linear-gradient(145deg, #3a4a75, #2a375c); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
    .btn-wa { background: linear-gradient(145deg, #2ce670, var(--wa)); box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35); }

    /* روابط سفلية */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .social:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .social svg { width: 22px; height: 22px; }

    .s-map { background: linear-gradient(145deg, #ea4335, #c5221f); box-shadow: 0 8px 20px rgba(234,67,53,0.3); }
    .s-snap { background: linear-gradient(145deg, #fffc00, #f7e600); color: #1a1a1a; box-shadow: 0 8px 20px rgba(247,230,0,0.3); }
    .s-tiktok { background: linear-gradient(145deg, #2b2b2b, #000); box-shadow: 0 8px 20px rgba(0,0,0,0.4); grid-column: 1 / -1; }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 380px) {
      .card { padding: 32px 18px 26px; }
      h1 { font-size: 22px; }
      .contact-info .num { font-size: 17px; }
    }
  </style>
</head>
